name: Hydro Jobs Bot

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  run-bot:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}

      run: |
        python main.py

    - name: Save seen_jobs.json and source_health.json
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add seen_jobs.json source_health.json
        git commit -m "update seen jobs and source health" || exit 0
        git push
